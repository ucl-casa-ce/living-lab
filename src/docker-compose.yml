version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - df-network

  backend:
    image: node:22.11.0
    container_name: backend
    depends_on:
      - postgres
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_data:/app/uploads # Persist uploaded files
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_PORT: ${BACKEND_PORT}
    command: >
      sh -c "
      cd /app/ &&
      npm install &&
      npm run typeorm -- migration:run -d ./data-source.ts &&
      npm run start:dev"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - df-network

  frontend:
    image: node:22.11.0
    container_name: frontend
    depends_on:
      - backend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      API_URL: ${API_URL}
    command: >
      sh -c "
      cd /app/ &&
      npm cache clean --force &&
      npm i &&
      npm run build &&
      npx serve -s dist -l tcp:0.0.0.0:${FRONTEND_PORT}"
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    networks:
      - df-network

  nginx:
    image: nginx:1.27.4
    container_name: nginx_proxy
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template
      - ./custom-entrypoint.sh:/custom-entrypoint.sh
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
    entrypoint: ["/bin/sh", "/custom-entrypoint.sh"]
    networks:
      - df-network

  # nodered:
  #  image: nodered/node-red:latest
  #  container_name: nodered
  #  ports:
  #    - "1880:1880"
  #  volumes:
  #    - ./node-red-data:/data
  #    - ./settings.js:/data/settings.js   # Optional: custom settings
  #  restart: unless-stopped
  #  networks:
  #    - df-network
  #  env_file:
  #    - .env

networks:
  df-network:
    driver: bridge

volumes:
  postgres_data:
  backend_data: